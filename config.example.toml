command = [
  "claude", "--dangerously-skip-permissions",
  "--model", "{model}", "--effort", "{thinking}", "--max-turns", "{max_turns}",
  "-p", "{prompt}", "--output-format", "stream-json", "--verbose", "--no-session-persistence"
]
env = { ANTHROPIC_BASE_URL = "https://aiprimetech.io" }

