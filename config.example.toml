[general]
provider_order = ["cerebras", "groq", "openrouter"]
timeout_seconds = 90
max_attempts = 8
max_models_per_provider = 3
max_prompt_chars = 24000
models_cache_seconds = 600

[providers.cerebras]
enabled = true
protocol = "openai"
base_url = "https://api.cerebras.ai/v1"
model = "auto"
auth = "bearer"
key_env = "CEREBRAS_API_KEY"

[providers.groq]
enabled = true
protocol = "openai"
base_url = "https://api.groq.com/openai/v1"
model = "auto"
auth = "bearer"
key_env = "GROQ_API_KEY"

[providers.openrouter]
enabled = true
protocol = "openai"
base_url = "https://openrouter.ai/api/v1"
model = "auto"
auth = "bearer"
key_env = "OPENROUTER_API_KEY"
headers = { X-OpenRouter-Title = "nesus_ai" }

# Google is intentionally fixed to gemini-3.5-flash-lite.
# Add Google or any OpenAI/Claude-compatible direct API or proxy with:
# nesus_ai add-provider
